name: Docs-only guard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  guard:
    name: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify only docs content is tracked
        run: |
          ALLOWED='^(\.github|\.gitignore|CHANGELOG\.md|README\.md|LICENSE|assets|docs-mintlify|screenshots|unraid-release)(/|$)'
          BAD=$(git ls-tree -r HEAD --name-only | grep -vE "$ALLOWED" || true)
          if [ -n "$BAD" ]; then
            echo "::error::Non-docs content detected - this repo must stay docs-only. See lucid-fabrics/bitbonsai@bb492a77 for why."
            echo "$BAD"
            exit 1
          fi

      - name: Scan for obvious secret patterns
        run: |
          if grep -rlE "BEGIN (RSA |EC |OPENSSH |)PRIVATE KEY|_authToken=[A-Za-z0-9-]{20,}" --exclude-dir=.git .; then
            echo "::error::Possible secret detected in tracked content"
            exit 1
          fi
