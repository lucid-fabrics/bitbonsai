name: ci-pr
on:
  pull_request:

jobs:
  validate:
    runs-on: self-hosted
    container:
      image: node:22-bookworm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Install deps
        env:
          FONTAWESOME_NPM_AUTH_TOKEN: ${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          npm ci --legacy-peer-deps
          npx prisma generate

      - name: Lint (affected)
        run: |
          npx nx affected -t lint --base=origin/main
          npx prettier --check "**/*.{md,scss,html}" --ignore-path .prettierignore

      - name: Test (affected)
        run: npx nx affected -t test --configuration=ci --base=origin/main

      - name: Build (affected)
        run: |
          npx nx affected -t build --configuration=production --base=origin/main
          if [ -f dist/apps/backend/main.js ]; then
            bash scripts/verify-backend-boot.sh
          fi

      - name: Notify Telegram (failure)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          apk add --no-cache curl
          COMMIT_SHORT="${GITHUB_SHA:0:7}"
          COMMIT_BRANCH=$(echo "${{ github.head_ref }}" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
          COMMIT_AUTHOR=$(echo "${{ github.actor }}" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
          COMMIT_MSG=$(echo "${{ github.event.pull_request.title }}" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
          MSG=$(printf '❌ <b>BitBonsai PR</b> - Validation failed\n\n🌿 <code>%s</code>\n🔖 <code>%s</code> · %s\n📝 %s\n\n🔗 %s' \
            "$COMMIT_BRANCH" "$COMMIT_SHORT" "$COMMIT_AUTHOR" "$COMMIT_MSG" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")
          curl -s --max-time 30 -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}&parse_mode=HTML&disable_web_page_preview=true" \
            --data-urlencode "text=$MSG" || true