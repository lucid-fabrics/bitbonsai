when:
  - event: pull_request

labels:
  platform: linux

clone:
  - name: clone
    image: woodpeckerci/plugin-git
    settings:
      lfs: false
      # Full history: nx affected needs the merge-base with main.
      depth: 0

steps:
  - name: install
    image: node:22
    environment:
      FONTAWESOME_NPM_AUTH_TOKEN:
        from_secret: FONTAWESOME_NPM_AUTH_TOKEN
    commands:
      - |
        # PR clones only fetch the PR ref; nx affected needs origin/main.
        git fetch --no-tags origin main:refs/remotes/origin/main
        npm ci --legacy-peer-deps
        npx prisma generate

  - name: lint
    image: node:22
    commands:
      - npx nx affected -t lint --base=origin/main
      # Advisory only: ~800 pre-existing files don't match .prettierrc's
      # implied defaults (predates this pipeline - every prior version of
      # this check ran with `|| true` too). Not blocking until that's
      # cleaned up separately.
      - npx prettier --check "**/*.{ts,json,md,scss,html}" --ignore-path .prettierignore || true

  - name: test
    image: node:22
    commands:
      - npx nx affected -t test --configuration=ci --base=origin/main

  - name: build
    image: node:22
    commands:
      - |
        npx nx affected -t build --configuration=production --base=origin/main
        # Workspace is fresh per pipeline, so the bundle exists iff backend
        # was affected by this PR. Catches DI wiring mistakes that lint,
        # build, and unit tests all miss (2026-07-17 incident).
        if [ -f dist/apps/backend/main.js ]; then
          bash scripts/verify-backend-boot.sh
        fi

  - name: notify_result
    image: alpine
    when:
      - status: [failure]
    environment:
      TELEGRAM_BOT_TOKEN:
        from_secret: TELEGRAM_BOT_TOKEN
      TELEGRAM_CHAT_ID:
        from_secret: TELEGRAM_CHAT_ID
    commands:
      - apk add --no-cache curl
      - |
        COMMIT_SHORT="${CI_COMMIT_SHA:0:7}"
        COMMIT_BRANCH=$(echo "$CI_COMMIT_BRANCH" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
        COMMIT_AUTHOR=$(echo "$CI_COMMIT_AUTHOR" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
        COMMIT_MSG=$(echo "$CI_COMMIT_MESSAGE" | head -1 | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
        MSG=$(printf '❌ <b>BitBonsai PR</b> - Validation failed\n\n🌿 <code>%s</code>\n🔖 <code>%s</code> · %s\n📝 %s\n\n🔗 %s' \
          "$COMMIT_BRANCH" "$COMMIT_SHORT" "$COMMIT_AUTHOR" "$COMMIT_MSG" "$CI_PIPELINE_URL")
        curl -s --max-time 30 -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
          -d "chat_id=${TELEGRAM_CHAT_ID}&parse_mode=HTML&disable_web_page_preview=true" \
          --data-urlencode "text=$MSG" || true
