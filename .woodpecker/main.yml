when:
  - event: push
    branch: main
  - event: manual

labels:
  platform: linux

clone:
  - name: clone
    image: woodpeckerci/plugin-git
    settings:
      lfs: false
      depth: 0

steps:
  - name: install
    image: node:22
    environment:
      FONTAWESOME_NPM_AUTH_TOKEN:
        from_secret: FONTAWESOME_NPM_AUTH_TOKEN
    commands:
      - npm ci --legacy-peer-deps
      - npx prisma generate

  - name: build_and_test
    image: node:22
    commands:
      - |
        # CI_PREV_COMMIT_SHA is the previous pipeline's commit on this repo.
        # On a manual run, first-ever push, or force-push it won't resolve
        # to a valid ancestor - fall back to running everything rather than
        # risk silently skipping affected projects.
        env | sort | grep '^CI_' || true
        BASE="${CI_PREV_COMMIT_SHA:-}"
        if [ -n "$BASE" ] && git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
          echo "Affected base: $BASE"
          npx nx affected -t test build --configuration=production --base="$BASE" --head="$CI_COMMIT_SHA"
        else
          echo "No usable base commit - running all projects"
          npx nx run-many -t test build --configuration=production
        fi

  - name: boot_check
    image: node:22
    commands:
      - |
        if [ -f dist/apps/backend/main.js ]; then
          bash scripts/verify-backend-boot.sh
        else
          echo "backend not built this run, skipping boot check"
        fi

  - name: deploy_website
    image: node:22
    environment:
      CLOUDFLARE_API_TOKEN:
        from_secret: CLOUDFLARE_API_TOKEN
      CLOUDFLARE_ACCOUNT_ID:
        from_secret: CLOUDFLARE_ACCOUNT_ID
    commands:
      - |
        if [ -d dist/apps/website/browser ]; then
          npx wrangler pages deploy dist/apps/website/browser --project-name=bitbonsai-website
        else
          echo "website not built this run, skipping deploy"
        fi

  - name: notify_result
    image: alpine
    when:
      - status: [success, failure]
    environment:
      TELEGRAM_BOT_TOKEN:
        from_secret: TELEGRAM_BOT_TOKEN
      TELEGRAM_CHAT_ID:
        from_secret: TELEGRAM_CHAT_ID
    commands:
      - apk add --no-cache curl
      - |
        if [ "$CI_PIPELINE_STATUS" = "success" ]; then TG_EMOJI="✅"; else TG_EMOJI="❌"; fi
        COMMIT_SHORT="${CI_COMMIT_SHA:0:7}"
        COMMIT_BRANCH=$(echo "$CI_COMMIT_BRANCH" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
        COMMIT_AUTHOR=$(echo "$CI_COMMIT_AUTHOR" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
        COMMIT_MSG=$(echo "$CI_COMMIT_MESSAGE" | head -1 | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
        MSG=$(printf '⚙️ <b>BitBonsai Main</b> - %s\n\n🌿 <code>%s</code>\n🔖 <code>%s</code> · %s\n📝 %s\n\n🔗 %s' \
          "$TG_EMOJI" "$COMMIT_BRANCH" "$COMMIT_SHORT" "$COMMIT_AUTHOR" "$COMMIT_MSG" "$CI_PIPELINE_URL")
        curl -s --max-time 30 -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
          -d "chat_id=${TELEGRAM_CHAT_ID}&parse_mode=HTML&disable_web_page_preview=true" \
          --data-urlencode "text=$MSG" || true
