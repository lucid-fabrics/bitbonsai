when:
  - event: manual

labels:
  platform: linux

clone:
  - name: clone
    image: woodpeckerci/plugin-git
    settings:
      lfs: false

steps:
  - name: build_and_push
    image: docker:cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      FONTAWESOME_NPM_AUTH_TOKEN:
        from_secret: FONTAWESOME_NPM_AUTH_TOKEN
      DOCKER_HUB_PASSWORD:
        from_secret: DOCKER_HUB_PASSWORD
    commands:
      - |
        apk add --no-cache nodejs
        VERSION=$(node -p "require('./package.json').version")
        MAJOR_MINOR=$(echo "$VERSION" | cut -d. -f1,2)
        MAJOR=$(echo "$VERSION" | cut -d. -f1)
        echo "Releasing lucidfabrics/bitbonsai:$VERSION"

        echo "$DOCKER_HUB_PASSWORD" | docker login -u lucidfabrics --password-stdin

        docker build \
          --platform linux/amd64 \
          --build-arg FONTAWESOME_NPM_AUTH_TOKEN="$FONTAWESOME_NPM_AUTH_TOKEN" \
          -f Dockerfile.prod --target production \
          -t "lucidfabrics/bitbonsai:latest" \
          -t "lucidfabrics/bitbonsai:$VERSION" \
          -t "lucidfabrics/bitbonsai:$MAJOR_MINOR" \
          -t "lucidfabrics/bitbonsai:$MAJOR" \
          .

        docker push --all-tags lucidfabrics/bitbonsai

  - name: notify_result
    image: alpine
    when:
      - status: [success, failure]
    environment:
      TELEGRAM_BOT_TOKEN:
        from_secret: TELEGRAM_BOT_TOKEN
      TELEGRAM_CHAT_ID:
        from_secret: TELEGRAM_CHAT_ID
    commands:
      - apk add --no-cache curl
      - |
        if [ "$CI_PIPELINE_STATUS" = "success" ]; then TG_EMOJI="✅"; else TG_EMOJI="❌"; fi
        COMMIT_SHORT="${CI_COMMIT_SHA:0:7}"
        COMMIT_AUTHOR=$(echo "$CI_COMMIT_AUTHOR" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
        MSG=$(printf '🚀 <b>BitBonsai Release</b> - %s\n\n🔖 <code>%s</code> · %s\n\n🔗 %s' \
          "$TG_EMOJI" "$COMMIT_SHORT" "$COMMIT_AUTHOR" "$CI_PIPELINE_URL")
        curl -s --max-time 30 -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
          -d "chat_id=${TELEGRAM_CHAT_ID}&parse_mode=HTML&disable_web_page_preview=true" \
          --data-urlencode "text=$MSG" || true
